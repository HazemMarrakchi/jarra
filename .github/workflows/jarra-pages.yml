name: Deploy Jarra to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test -- --browsers ChromeHeadlessCI

      - name: Production build
        run: npm run build -- --base-href /jarra/

      - name: Prepare 404 fallback for SPA
        run: |
          cp dist/jarra/browser/index.html dist/jarra/browser/404.html
          du -sh dist/jarra/browser

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/jarra/browser
          force_orphan: true

      # Garantit que les GitHub Pages servent bien la branche gh-pages
      # (idempotent : POST crée le site, PUT met à jour la source).
      - name: Enable GitHub Pages (gh-pages branch)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY}"
          echo "Configuring GitHub Pages to serve the gh-pages branch…"
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${repo}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true
          curl -sS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${repo}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true
