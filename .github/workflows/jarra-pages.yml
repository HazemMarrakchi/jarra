name: Deploy Jarra to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test -- --browsers ChromeHeadlessCI

      - name: Production build
        run: npm run build -- --base-href /jarra/

      - name: Prepare 404 fallback for SPA
        run: |
          cp dist/jarra/browser/index.html dist/jarra/browser/404.html
          du -sh dist/jarra/browser

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/jarra/browser
          force_orphan: true
